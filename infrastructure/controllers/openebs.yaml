---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: storage
spec:
  interval: 24h
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: storage
spec:
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
      version: "*"
  interval: 30m
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    mayastor:
      csi:
        node:
          initContainers:
            enabled: false
      io_engine:
        cpuCount: "1"
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
            hugepages2Mi: "1Gi"
          requests:
            cpu: "1"
            memory: "1Gi"
            hugepages2Mi: "1Gi"
      storageClass:
        nameSuffix: triple-replicas
        parameters:
          fsType: ext4
          protocol: nvmf
          repl: 3
          thick: "true"
          thin: "false"
