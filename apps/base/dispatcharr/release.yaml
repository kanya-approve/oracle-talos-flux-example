---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dispatcharr
  namespace: apps
spec:
  chart:
    spec:
      chart: dispatcharr
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    persistence:
      data:
        size: 100Mi
        type: emptyDir
      postgres-run:
        size: 100Mi
        type: emptyDir