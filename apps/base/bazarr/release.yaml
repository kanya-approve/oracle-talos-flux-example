---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: apps
spec:
  chart:
    spec:
      chart: bazarr
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    common:
      ingress:
        main:
          integrations:
            traefik:
              enabled: false
    metrics:
      main:
        enabled: false
    persistence:
      config:
        size: 50Mi
        type: emptyDir
    portal:
      open:
        enabled: false
    workload:
      exportarr:
        enabled: false
