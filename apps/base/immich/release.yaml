---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: apps
spec:
  chart:
    spec:
      chart: immich
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    common:
      ingress:
        main:
          integrations:
            traefik:
              enabled: false
    persistence:
      backups:
        size: 1Gi
        type: emptyDir
      library:
        size: 1Gi
        type: emptyDir
      microcache:
        enabled: false
      mlcache:
        enabled: false
      profile:
        size: 100Mi
        type: emptyDir
      thumbs:
        size: 100Mi
        type: emptyDir
      uploads:
        size: 1Gi
        type: emptyDir
      video:
        size: 1Gi
        type: emptyDir
    portal:
      open:
        enabled: false
    workload:
      machinelearning:
        podSpec:
          containers:
            machinelearning:
              resources: {}