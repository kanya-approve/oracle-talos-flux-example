  orionoid.yml: |
    id: orionoid
    name: Orionoid
    description: "Orionoid Indexer"
    language: en-US
    type: public
    encoding: UTF-8
    followredirect: false
    testlinktorrent: false
    requestDelay: 2
    links:
      - https://api.orionoid.com
    
    caps:
      categories:
        Movies: Movies
        TV: TV
      modes:
        search: [q]
        movie-search: [q, imdbid]
        tv-search: [q, imdbid, season, ep]
      allowrawsearch: false
    settings:
      - name: api_token
        type: password
        label: Orionoid API Token
        default: ""
      - name: default_movie_query
        label: "Default Movie Imdb Query"
        type: text
        default: "tt0137523"
      - name: default_tv_query
        type: text
        label: "Default TV Imdb Query"
        default: "tt18482892"
      - name: max_results
        type: text
        label: "Max Results Returned - 10 Recommended."
        default: "10"
    
    search:
      paths:
        - path: /?keyapp=FGJKJFEBRHEMRFGSBGDLFPRGED96LJJL&keyuser={{ .Config.api_token }}&streamtype=torrent&mode=stream&action=retrieve&type=movie&sortvalue=videoquality&sortorder=ascending&idimdb={{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.default_movie_query }}{{ end }}&limitcount={{ .Config.max_results }}
          method: get
          response:
            type: json
          categories: [Movies]
    
        - path: /?keyapp=FGJKJFEBRHEMRFGSBGDLFPRGED96LJJL&keyuser={{ .Config.api_token }}&streamtype=torrent&mode=stream&action=retrieve&type=show&idimdb={{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.default_tv_query }}{{ end }}&numberseason={{ if .Query.Season }}{{ .Query.Season }}{{ else }}1{{ end }}{{ if .Query.Ep }}&numberepisode={{ .Query.Ep }}{{ else }}{{ end }}&limitcount={{ .Config.max_results }}
          method: get
          response:
            type: json
          categories: [TV]
    
      rows:
        selector: $.data.streams
        missingAttributeEqualsNoResults: true
    
      fields:
        title:
          selector: file.name
        year:
          selector: file.name
          filters:
            - name: regexp
              args: "(\\b(19|20)\\d{2}\\b)"
        category_is_tv_show:
          selector: file.name
          filters:
            - name: regexp
              args: "\\b(S\\d+(?:E\\d+)?)\\b"
        category:
          text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"
        infohash:
          selector: file.hash
        size:
          selector: file.size
        quality:
          selector: video.quality
        source:
          selector: stream.source
        codec:
          selector: video.codec
        group:
          selector: meta.uploader
        magnetlink:
          selector: links[0]
        download_link:
          selector: links[0]
        seeders:
          text: "30"
        leechers:
          text: "10"
        date:
          selector: time.added
          filters:
            - name: timestamp
              args: "%Y-%m-%d %H:%M:%S"
  torbox.yml: |
    ---
    id: torbox-torrents
    name: TorBox Torrents
    description: "Torbox Torrents (300 requests/min)"
    language: en-US
    type: public
    encoding: UTF-8
    followredirect: false
    testlinktorrent: false
    requestDelay: 2
    links:
      - https://search-api.torbox.app
    caps:
      categories:
        Movies: Movies
        TV: TV
      modes:
        search: [q]
        tv-search: [q, imdbid, season, ep]
        movie-search: [q, imdbid]
      allowrawsearch: false
    
    settings:
      - name: apikey
        type: password
        label: Torbox API Key
        default: ""
      - name: validation_label
        type: info
        label: Validation settings optional
      - name: validate_imdb_movie_label
        type: info
        label: The following help to validate an indexer in Sonarr by confirming that the show returns results
      - name: validate_imdb_movie
        type: text
        label: IMDB ID of Movie to use for Radarr validation (must exist in indexer)
        default: "tt0137523" # Fight Club
      - name: validate_imdb_tv_label
        type: info
        label: The following help to validate an indexer in Sonarr by confirming that the show returns results
      - name: validate_imdb_tv
        type: text
        label: IMDB ID TV show to use for Sonarr validation (must exist in indexer)
        default: "tt9288030" # Reacher S02E01
    
    search:
      headers:
        Authorization: ["Bearer {{ .Config.apikey }}"]
        User-Agent:
          [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0",
          ]
      paths:
        - path: "{{ if .Query.IMDBID }}torrents/imdb:{{ .Query.IMDBID }}{{ else }}torrents/imdb:{{ .Config.validate_imdb_movie }}{{ end }}"
          method: get
          response:
            type: json
            noResultsMessage: "Could not find metadata. Please try again later."
          categories: [Movies]
        - path: "{{ if .Query.IMDBID }}torrents/imdb:{{ .Query.IMDBID }}{{else}}torrents/imdb:{{ .Config.validate_imdb_tv }}{{ end }}?season={{ if .Query.Season }}{{ .Query.Season }}{{ else }}1{{ end }}&episode={{ if .Query.Ep }}{{ .Query.Ep }}{{ else }}1{{ end }}"
          method: get
          response:
            type: json
            noResultsMessage: "Could not find metadata. Please try again later."
          categories: [TV]
    
      rows:
        selector: data.torrents
        count:
          selector: data.total_torrents
    
      fields:
        title:
          selector: raw_title
        size:
          selector: size
        category_is_tv_show:
          text: "{{ .Result.title }}"
          filters:
            - name: regexp
              args: "\\b(S\\d+(?:E\\d+)?)\\b"
        category:
          text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"
        details:
          text: "{{ .Config.sitelink }}"
        magnet:
          selector: magnet
        year:
          selector: title
          filters:
            - name: regexp
              args: "(\\b(19|20)\\d\\d\\b)"
        date_in_days:
          selector: age
        date:
          text: "{{ .Result.date_in_days }} days"
          filters:
            - name: timeago
        seeders:
          selector: last_known_seeders
  torrentio.yml: |
    ---
    id: torrentio
    name: Torrentio
    description: "Torrentio Indexer"
