      - name: validate_imdb_movie
        type: text
        label: IMDB ID of Movie to use for Radarr validation (must exist in indexer)
        default: "tt0137523" # Fight Club
      - name: validate_imdb_tv
        type: text
        label: IMDB ID TV show to use for Sonarr validation (must exist in indexer)
        default: "tt9288030" # Reacher S02E01

    search:
      headers:
        User-Agent:
          [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0",
          ]
      paths:
        - path: "{{ if .Query.IMDBID }}{{ .Config.default_opts }}|{{ .Config.debrid_provider }}={{ .Config.debrid_provider_key }}/stream/movie/{{ .Query.IMDBID }}.json{{ else }}providers=rarbg,1337x|sort=size|qualityfilter=brremux,hdrall,dolbyvision,4k,720p,480p,other,scr,cam,unknown|{{ .Config.debrid_provider }}={{ .Config.debrid_provider_key }}/stream/movie/{{ .Config.validate_imdb_movie }}.json{{ end }}"
          method: get
          response:
            type: json
            noResultsMessage: '"streams": []'
          categories: [Movies]
        - path: "{{ if .Query.IMDBID }}{{ .Config.default_opts }}{{else}}providers=rarbg,1337x|sort=size|qualityfilter=brremux,hdrall,dolbyvision,4k,720p,480p,other,scr,cam,unknown{{ end }}|{{ .Config.debrid_provider }}={{ .Config.debrid_provider_key }}/stream/series/{{ if .Query.IMDBID }}{{ .Query.IMDBID}}{{ else }}{{ .Config.validate_imdb_tv }}{{ end }}:{{ if .Query.Season }}{{ .Query.Season }}{{ else }}1{{ end }}:{{ if .Query.Ep }}{{ .Query.Ep }}{{ else }}1{{ end }}.json"
          method: get
          response:
            type: json
            noResultsMessage: '"streams": []'
          categories: [TV]

      rows:
        selector: streams
        missingAttributeEqualsNoResults: true

      fields:
        title:
          selector: title
          filters:
            - name: split
              args: ["\n", 0]
        year:
          selector: title
          filters:
            - name: regexp
              args: "(\\b(19|20)\\d\\d\\b)"
        category_is_tv_show:
          text: "{{ .Result.title }}"
          filters:
            - name: regexp
              args: "\\b(S\\d+(?:E\\d+)?)\\b"
        category:
          text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"
        infohash:
          selector: infoHash
        seeders:
          selector: title
          filters:
            - name: regexp
              args: "👤 (\\d+)"
        leechers:
          text: "0"
        size:
          selector: title
          filters:
            - name: regexp
              args: "💾 (\\d+(?:\\.\\d+)? [KMGT]B)"
  zilean.yml: |
    id: zilean
    name: Zilean
    description: "A custom indexer for Zilean the unofficial DMM indexer"
    language: en-US
    type: public
    encoding: UTF-8
    followredirect: false
    testlinktorrent: false
    requestDelay: 2
    links:
      - http://zilean:8181
      - https://zilean.elfhosted.com
    
    caps:
      categories:
        Movies: Movies
        TV: TV
      modes:
        search: [q]
        movie-search: [q, imdbid]
        tv-search: [q, season, ep]
      allowrawsearch: false
    
    settings: []
    
    search:
      paths:
        - path: /dmm/filtered
          method: get
          response:
            type: json
    
      inputs:
        $raw: "{{ if .Query.IMDBID }}ImdbId={{ .Query.IMDBID }}{{ else }}Query={{ .Keywords }}{{ end }}"
        Season: "{{ if .Query.Season }}{{ .Query.Season }}{{ else }}{{ end }}"
        Episode: "{{ if .Query.Ep }}{{ .Query.Ep }}{{ else }}{{ end }}"
        
      keywordsfilters:
        - name: re_replace
          args: ["\\bS\\d+(?:E\\d+)?\\b", ""]  # Remove season and episode info
        - name: re_replace
          args: ["\\b(19|20)\\d{2}\\b", ""]  # Remove year info
        - name: re_replace
          args: ["[\\[\\]()]", ""]  # Remove brackets
        - name: re_replace
          args: ["^$", "limitless"]
    
      rows:
        selector: $
        missingAttributeEqualsNoResults: true
    
      fields:
        title:
          selector: raw_title
        year:
          selector: year
        category:
          selector: category
          filters:
            - name: replace
              args: ["tvSeries", "TV"]
            - name: replace
              args: ["movie", "Movies"]
        infohash:
          selector: info_hash
        size:
          selector: size
        quality:
          selector: resolution
          filters:
            - name: replace
              args: ["4k", "2160p"]
        codec:
          selector: codec
        episode:
          selector: episodes
        season:
          selector: seasons
        language:
          selector: languages
        seeders:
          text: "30"
        leechers:
          text: "10"
        date:
          text: "Apr. 18th '11"
          filters:
            - name: re_replace
              args: ["st|nd|rd|th", ""]
            - name: replace
              args: ["'", ""]
            - name: dateparse
              args: "MMM. d yy"
        downloadvolumefactor:
          text: "1"
        uploadvolumefactor:
          text: "1"
