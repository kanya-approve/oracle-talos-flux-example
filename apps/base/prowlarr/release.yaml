---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: apps
spec:
  chart:
    spec:
      chart: prowlarr
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    common:
      ingress:
        main:
          integrations:
            traefik:
              enabled: false
    metrics:
      main:
        enabled: false
    persistence:
      aiostreams:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/aiostreams.yml
        objectName: prowlarr-indexers
        subPath: aiostreams.yml
        type: configmap
      comet:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/comet.yml
        objectName: prowlarr-indexers
        subPath: comet.yml
        type: configmap
      config:
        size: 50Mi
        type: emptyDir
      debridio:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/debridio.yml
        objectName: prowlarr-indexers
        subPath: debridio.yml
        type: configmap
      orionoid:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/orionoid.yml
        objectName: prowlarr-indexers
        readOnly: true
        subPath: orionoid.yml
        type: configmap
      stremthru:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/stremthru.yml
        objectName: prowlarr-indexers
        readOnly: true
        subPath: stremthru.yml
        type: configmap
      torbox:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/torbox.yml
        objectName: prowlarr-indexers
        readOnly: true
        subPath: torbox.yml
        type: configmap
      torrentio:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/torrentio.yml
        objectName: prowlarr-indexers
        readOnly: true
        subPath: torrentio.yml
        type: configmap
      zilean:
        defaultMode: "0664"
        enabled: true
        expandObjectName: false
        mountPath: /config/Definitions/Custom/zilean.yml
        objectName: prowlarr-indexers
        readOnly: true
        subPath: zilean.yml
        type: configmap
    portal:
      open:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                HOME: /tmp
                PROWLARR__APP__LAUNCHBROWSER: "False"
                PROWLARR__APP__THEME: dark
                PROWLARR__AUTH__METHOD: Forms
                PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
                PROWLARR__LOG__ANALYTICSENABLED: "False"
                PROWLARR__LOG__DBENABLED: "False"
                PROWLARR__LOG__LEVEL: info
