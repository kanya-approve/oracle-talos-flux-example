---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: apps
spec:
  chart:
    spec:
      chart: flaresolverr
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    persistence:
      config:
        size: 50Mi
        type: emptyDir
